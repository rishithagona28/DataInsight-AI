[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f2f1ec"
textColor = "#0b0b0b"
linkColor = "#2a78d6"
borderColor = "#e1e0d9"
codeBackgroundColor = "#f2f1ec"
codeTextColor = "#0b0b0b"

redColor = "#e34948"
orangeColor = "#eb6834"
yellowColor = "#eda100"
greenColor = "#008300"
blueColor = "#2a78d6"
violetColor = "#4a3aa7"
grayColor = "#898781"

chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"]

font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap"
baseFontSize = 15
baseFontWeight = 400
headingFontWeights = [700, 700, 600, 600, 600, 600]

baseRadius = "12px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

[theme.dark]
primaryColor = "#5b9ee6"
backgroundColor = "#0f0f0e"
secondaryBackgroundColor = "#1a1a18"
textColor = "#f2f1ec"
linkColor = "#5b9ee6"
borderColor = "#33322c"
codeBackgroundColor = "#1a1a18"
codeTextColor = "#f2f1ec"

redColor = "#ff7472"
orangeColor = "#ff8f5e"
yellowColor = "#ffc233"
greenColor = "#3ecf5f"
blueColor = "#5b9ee6"
violetColor = "#8b7ae0"
grayColor = "#a6a49c"

chartCategoricalColors = ["#5b9ee6", "#ff8f5e", "#35d6a0", "#ffc233", "#f5a0c2", "#3ecf5f", "#8b7ae0", "#ff7472"]

[theme.light.sidebar]
backgroundColor = "#f2f1ec"
secondaryBackgroundColor = "#e8e6df"
borderColor = "#e1e0d9"

[theme.dark.sidebar]
backgroundColor = "#161615"
secondaryBackgroundColor = "#1e1e1c"
borderColor = "#33322c"

[client]
toolbarMode = "minimal"
